name: iOS Build (no Mac needed)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web app into native shell
        run: npx cap sync ios

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "key content length: ${#ASC_KEY_CONTENT}"
          echo "key content starts with: ${ASC_KEY_CONTENT:0:12}"
          echo "$ASC_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Debug key file
        run: |
          ls -la ~/private_keys/
          wc -c ~/private_keys/*.p8
          head -c 32 ~/private_keys/*.p8; echo
          tail -c 32 ~/private_keys/*.p8; echo

      - name: Archive app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            -allowProvisioningUpdates archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            -allowProvisioningUpdates

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BibleShuffle-IPA
          path: build/ipa/*.ipa

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f build/ipa/*.ipa \
            -apiKey ${{ secrets.ASC_KEY_ID }} \
            -apiIssuer ${{ secrets.ASC_ISSUER_ID }}
