name: iOS Build (no Mac needed)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Add iOS platform (skips if it already exists)
        run: npx cap add ios || true

      - name: Sync web app into native shell
        run: npx cap sync ios

      - name: Decode App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_CONTENT }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Replace placeholder app icon with final app icon
        run: |
          python3 - <<'PYI'
          import json, subprocess, os, glob
          src = "AppIcon-1024.png"
          sets = glob.glob("ios/App/**/AppIcon.appiconset", recursive=True)
          if not sets:
              raise SystemExit("No AppIcon.appiconset found - icon NOT replaced")
          d = sets[0]
          with open(os.path.join(d, "Contents.json")) as f:
              cj = json.load(f)
          replaced = 0
          for img in cj.get("images", []):
              fn = img.get("filename")
              size = img.get("size")
              scale = img.get("scale", "1x")
              if not (fn and size):
                  continue
              w, h = (int(x) for x in size.split("x"))
              mult = int(scale.rstrip("x"))
              subprocess.run(["sips", "-z", str(h * mult), str(w * mult), src, "--out", os.path.join(d, fn)], check=True)
              replaced += 1
          if replaced == 0:
              raise SystemExit("No icon entries found in Contents.json - icon NOT replaced")
          print(f"Replaced {replaced} icon files in {d}")
          PYI

      - name: Archive app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            -allowProvisioningUpdates archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            -allowProvisioningUpdates

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BibleShuffle-IPA
          path: build/ipa/*.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ipa/*.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          key-id: ${{ secrets.ASC_KEY_ID }}
          api-key-content-base64: ${{ secrets.ASC_KEY_CONTENT }}
