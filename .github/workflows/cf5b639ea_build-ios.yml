name: iOS Build (no Mac needed)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (need iOS 26 SDK for App Store)
        run: |
          ls /Applications/ | grep -i xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web app into native shell
        run: npx cap sync ios

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEYFILE=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          if echo "$ASC_KEY_CONTENT" | base64 --decode 2>/dev/null | head -c 40 | grep -q "BEGIN PRIVATE KEY"; then
            echo "Secret is the whole file encoded - decoding"
            echo "$ASC_KEY_CONTENT" | base64 --decode > "$KEYFILE"
          else
            echo "Secret is the raw key text - wrapping in PEM headers"
            echo "-----BEGIN PRIVATE KEY-----" > "$KEYFILE"
            echo "$ASC_KEY_CONTENT" >> "$KEYFILE"
            echo "-----END PRIVATE KEY-----" >> "$KEYFILE"
          fi
          echo "Key file first line: $(head -1 "$KEYFILE")"

      - name: Replace placeholder app icon with final app icon
        run: |
          python3 - <<'PYI'
          import json, subprocess, os, glob
          src = "AppIcon-1024.png"
          sets = glob.glob("ios/App/**/AppIcon.appiconset", recursive=True)
          if not sets:
              raise SystemExit("No AppIcon.appiconset found - icon NOT replaced")
          d = sets[0]
          with open(os.path.join(d, "Contents.json")) as f:
              cj = json.load(f)
          replaced = 0
          for img in cj.get("images", []):
              fn = img.get("filename")
              size = img.get("size")
              scale = img.get("scale", "1x")
              if not (fn and size):
                  continue
              w, h = (int(x) for x in size.split("x"))
              mult = int(scale.rstrip("x"))
              subprocess.run(["sips", "-z", str(h * mult), str(w * mult), src, "--out", os.path.join(d, fn)], check=True)
              replaced += 1
          if replaced == 0:
              raise SystemExit("No icon entries found in Contents.json - icon NOT replaced")
          print(f"Replaced {replaced} icon files in {d}")
          PYI

      - name: Archive app (ad-hoc signing, re-signed at export)
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :teamID" ExportOptions.plist 2>/dev/null || echo "$ASC_TEAM_ID")
          if [ -z "$TEAM_ID" ]; then
            echo "ERROR: No team ID found in ExportOptions.plist or ASC_TEAM_ID secret"
            exit 1
          fi
          echo "Using team ID: $TEAM_ID"
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Export IPA (real App Store signing)
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            -allowProvisioningUpdates

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BibleShuffle-IPA
          path: build/ipa/*.ipa

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f build/ipa/*.ipa \
            -t ios \
            --api-key ${{ secrets.ASC_KEY_ID }} \
            --api-issuer ${{ secrets.ASC_ISSUER_ID }}
