<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BibleShuffle</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f5ef;
      color: #2b2b2b;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    .verse { font-size: 1.35rem; line-height: 1.7; margin-bottom: 16px; }
    .ref { font-size: 0.95rem; opacity: 0.6; margin-bottom: 48px; }
    .note { font-family: -apple-system, sans-serif; font-size: 0.85rem; opacity: 0.45; }
  </style>
</head>
<body>
  <div class="card">
    <p class="verse">
      "But they that wait upon the LORD shall renew their strength; they shall mount up
      with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."
    </p>
    <p class="ref">Isaiah 40:31 (KJV)</p>
    <p class="note">You appear to be offline. Reconnect to keep shuffling.</p>
  </div>
</body>
</html>
